<div class="container">

  <div class="topo">
    <h1>Receitas</h1>

    <button class="btn-novo" (click)="abrirFormulario()">
      + Nova Receita
    </button>
  </div>

  <div class="filtros">
    <input
      [(ngModel)]="busca"
      placeholder="Buscar receita..."
    />

    <select [(ngModel)]="categoriaFiltro">
      <option value="">Todas categorias</option>
      <option value="SALARIO">SALARIO</option>
      <option value="FREELANCE">FREELANCE</option>
      <option value="INVESTIMENTOS">INVESTIMENTOS</option>
      <option value="OUTROS">OUTROS</option>
    </select>
  </div>

  <div class="formulario" *ngIf="mostrarFormulario">

    <h2>
      {{ editando ? 'Editar Receita' : 'Nova Receita' }}
    </h2>

    <input
      [(ngModel)]="descricao"
      placeholder="Descrição"
    />

    <input
      type="number"
      [(ngModel)]="valor"
      placeholder="Valor"
    />

    <input
      type="date"
      [(ngModel)]="data"
    />

    <select [(ngModel)]="categoria">
      <option value="SALARIO">SALARIO</option>
      <option value="FREELANCE">FREELANCE</option>
      <option value="INVESTIMENTOS">INVESTIMENTOS</option>
      <option value="OUTROS">OUTROS</option>
    </select>

    <button class="btn-salvar" (click)="salvar()">
      Salvar
    </button>

    <button class="btn-cancelar" (click)="fecharFormulario()">
      Cancelar
    </button>

  </div>

  <table>

    <thead>
      <tr>
        <th>Descrição</th>
        <th>Valor</th>
        <th>Data</th>
        <th>Categoria</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let receita of receitasFiltradas()">
        <td>{{ receita.descricao }}</td>
        <td>R$ {{ receita.valor }}</td>
        <td>{{ receita.data }}</td>
        <td>{{ receita.categoria }}</td>
        <td>
          <button class="btn-editar" (click)="editar(receita)">
            Editar
          </button>

          <button class="btn-excluir" (click)="excluir(receita.id)">
            Excluir
          </button>
        </td>
      </tr>
    </tbody>

  </table>

  <div class="paginacao">

    <button
      (click)="paginaAnterior()"
      [disabled]="paginaAtual === 0"
    >
      Anterior
    </button>

    <span>
      Página {{ paginaAtual + 1 }} de {{ totalPaginas }}
    </span>

    <button
      (click)="proximaPagina()"
      [disabled]="paginaAtual + 1 >= totalPaginas"
    >
      Próxima
    </button>

  </div>

</div>
