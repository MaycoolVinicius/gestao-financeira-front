<div class="cadastro-page">

  <div class="cadastro-card">

    <div class="logo">
      💸
    </div>

    <h1>Criar conta</h1>

    <p class="subtitulo">
      Preencha os dados abaixo para começar a controlar sua vida financeira
    </p>

    <div class="campo">
      <label>Nome</label>

      <input
        type="text"
        placeholder="Digite seu nome"
        [(ngModel)]="nome"
      />
    </div>

    <div class="campo">
      <label>Email</label>

      <input
        type="email"
        placeholder="Digite seu email"
        [(ngModel)]="email"
      />
    </div>

    <div class="campo">
      <label>Senha</label>

      <input
        type="password"
        placeholder="Digite sua senha"
        [(ngModel)]="senha"
      />
    </div>

    <div class="campo">
      <label>Confirmar senha</label>

      <input
        type="password"
        placeholder="Confirme sua senha"
        [(ngModel)]="confirmarSenha"
      />
    </div>

    <button (click)="criarConta()">
      Criar conta
    </button>

    <div class="acoes-cadastro">
      <a routerLink="/login">
        Já tenho uma conta
      </a>
    </div>

  </div>

</div>
